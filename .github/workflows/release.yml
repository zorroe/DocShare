# ============================================================
#  自动发布: 推送 v* 标签时
#   1. 版本一致性检查 + Go 单元测试 + UI 冒烟测试
#   2. 构建三件套(便携版/安装版/CLI 服务端)
#   3. 创建 GitHub Release 并上传产物
#  用法: git tag v1.2.0 && git push origin v1.2.0
# ============================================================
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 拉取全部历史与标签, 用于生成变更日志

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x' # 与 go.mod 的 go 1.25.0 对齐(避免工具链自动下载)
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 版本一致性检查
        shell: pwsh
        run: ./tools/check-version.ps1

      - name: Go 单元测试
        shell: pwsh
        run: |
          go vet ./...
          go test -race ./...

      - name: 安装并审计 UI 测试依赖
        shell: pwsh
        run: |
          npm ci --prefix test --registry=https://registry.npmjs.org/
          npm audit --prefix test --omit=dev --audit-level=high --registry=https://registry.npmjs.org/

      - name: 安装 NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: 安装 Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: UI 冒烟测试(Edge + puppeteer-core)
        shell: pwsh
        run: ./test/run.ps1

      - name: 构建桌面产物(便携版 + 安装版)
        shell: pwsh
        run: ./build_desktop.ps1

      - name: 构建 CLI 服务端
        shell: pwsh
        run: |
          go build -ldflags "-s -w" -o release/DocShare-Server.exe ./backend
          $hash = (Get-FileHash release/DocShare-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DocShare-Setup.exe" | Set-Content -NoNewline release/DocShare-Setup.exe.sha256

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git tag --sort=-creatordate | Select-Object -Skip 1 -First 1
          $log = if ($prev) { git log --oneline "$prev..HEAD" | ForEach-Object { "- $_" } } else { "- 首次发布" }
          $notes = "## DocShare $tag`n`n### 本次变更`n`n$log"
          gh release create $tag --title "DocShare $tag" --notes $notes `
            release/DocShare-Setup.exe release/DocShare-Setup.exe.sha256 `
            release/DocShare.exe release/DocShare-Server.exe
